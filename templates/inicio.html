<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Restrito</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#1f2937 0%,#0a0a0a 40%,#000000 100%);
    overflow:hidden;
    position:relative;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    repeating-radial-gradient(circle at center,
    rgba(212,175,55,.04) 0px,
    rgba(212,175,55,.04) 2px,
    transparent 3px,
    transparent 30px);
    animation:rotate 40s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.scanline{
    position:absolute;
    width:100%;
    height:2px;
    background:linear-gradient(90deg,transparent,#d4af37,transparent);
    animation:scan 6s linear infinite;
    opacity:.4;
}

@keyframes scan{
    from{top:-10%}
    to{top:110%}
}

.card{
    position:relative;
    width:90%;
    max-width:800px;
    padding:60px;
    background:rgba(10,10,10,.88);
    border:1px solid rgba(212,175,55,.25);
    border-radius:8px;
    text-align:center;
    backdrop-filter:blur(10px);
    box-shadow:
    0 0 0 1px rgba(212,175,55,.1),
    0 0 40px rgba(212,175,55,.08),
    0 30px 80px rgba(0,0,0,.8);
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
    135deg,
    transparent,
    rgba(212,175,55,.03),
    transparent);
    pointer-events:none;
}

.logo{
    font-size:90px;
    color:#d4af37;
    margin-bottom:20px;
    text-shadow:0 0 20px rgba(212,175,55,.25);
}

.classified{
    color:#d4af37;
    font-size:.85rem;
    letter-spacing:6px;
    text-transform:uppercase;
    margin-bottom:20px;
}

h1{
    color:#f5e6a9;
    font-size:3rem;
    letter-spacing:2px;
    margin-bottom:20px;
    font-weight:300;
}

.line{
    width:120px;
    height:2px;
    background:#d4af37;
    margin:25px auto;
}

p{
    color:#b8b8b8;
    line-height:1.8;
    font-size:1.1rem;
    max-width:600px;
    margin:auto;
}

.btn{
    display:inline-block;
    margin-top:40px;
    padding:18px 45px;
    text-decoration:none;
    color:#000;
    background:linear-gradient(135deg,#f5e6a9,#d4af37);
    border-radius:3px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    transition:.35s;
    box-shadow:0 0 25px rgba(212,175,55,.25);
}

.btn:hover{
    transform:translateY(-4px);
    box-shadow:0 0 40px rgba(212,175,55,.45);
}

.footer{
    margin-top:45px;
    color:#777;
    font-size:.9rem;
    letter-spacing:1px;
}

.footer span{
    color:#d4af37;
}

.corners{
    position:absolute;
    inset:15px;
    border:1px solid rgba(212,175,55,.08);
    pointer-events:none;
}

.corners::before,
.corners::after{
    content:"";
    position:absolute;
    width:40px;
    height:40px;
    border-color:#d4af37;
}

.corners::before{
    top:-1px;
    left:-1px;
    border-top:2px solid;
    border-left:2px solid;
}

.corners::after{
    bottom:-1px;
    right:-1px;
    border-bottom:2px solid;
    border-right:2px solid;
}

.agent{
    position:absolute;
    top:25px;
    right:25px;
    color:rgba(212,175,55,.35);
    font-size:.85rem;
    letter-spacing:3px;
}
</style>
</head>
<body>

<div class="scanline"></div>

<div class="card">

    <div class="corners"></div>

    <div class="agent">AGENT 007</div>

    <div class="logo">◉</div>

    <div class="classified">Classified Access</div>

    <h1>ACESSO RESTRITO</h1>

    <div class="line"></div>

    <p>
        Esta área contém informações protegidas.
        Apenas usuários autorizados possuem permissão para continuar.
        Identifique-se para prosseguir.
    </p>

    <a href="/acesso/" class="btn">
        Efetuar Login
    </a>

    <div class="footer">
        Desenvolvido por <span>Vinicius Brandão</span> • Secure Systems Division
    </div>

</div>

<script>
const card=document.querySelector(".card");

document.addEventListener("mousemove",e=>{
    const x=(window.innerWidth/2-e.clientX)/40;
    const y=(window.innerHeight/2-e.clientY)/40;
    card.style.transform=`rotateY(${x}deg) rotateX(${-y}deg)`;
});
</script>

</body>
</html>
