```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área Secreta</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at center,#111827 0%,#050505 70%);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    repeating-radial-gradient(
        circle at center,
        rgba(212,175,55,.04) 0px,
        rgba(212,175,55,.04) 2px,
        transparent 3px,
        transparent 35px
    );
    animation:spin 60s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.login-box{
    position:relative;
    width:420px;
    padding:50px;
    background:rgba(5,5,5,.88);
    border:1px solid rgba(212,175,55,.15);
    border-radius:12px;
    backdrop-filter:blur(15px);
    box-shadow:
    0 0 50px rgba(212,175,55,.08),
    0 30px 80px rgba(0,0,0,.8);
    z-index:10;
}

.login-box::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        135deg,
        transparent,
        rgba(212,175,55,.03),
        transparent
    );
    pointer-events:none;
}

.classified{
    text-align:center;
    color:#d4af37;
    letter-spacing:5px;
    font-size:.75rem;
    text-transform:uppercase;
    margin-bottom:10px;
}

h2{
    text-align:center;
    color:#f5e6a9;
    font-weight:300;
    letter-spacing:2px;
    margin-bottom:35px;
}

.user-box{
    position:relative;
    margin-bottom:30px;
}

.user-box input{
    width:100%;
    padding:15px 0;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:15px;
    border-bottom:1px solid rgba(212,175,55,.3);
}

.user-box label{
    position:absolute;
    left:0;
    top:15px;
    color:#999;
    transition:.3s;
    pointer-events:none;
}

.user-box input:focus~label,
.user-box input:valid~label{
    top:-10px;
    font-size:12px;
    color:#d4af37;
}

.btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    background:linear-gradient(135deg,#f5e6a9,#d4af37);
    color:#000;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 35px rgba(212,175,55,.4);
}

.scan{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:2px;
    background:linear-gradient(90deg,transparent,#d4af37,transparent);
    animation:scan 4s linear infinite;
}

@keyframes scan{
    from{top:0}
    to{top:100%}
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:.85rem;
}

.footer span{
    color:#d4af37;
}
</style>
</head>

<body>

<div class="login-box">

<div class="scan"></div>

<div class="classified">
CLASSIFIED ACCESS
</div>

<h2>Área Secreta</h2>

<form id="form1" action="https://minhapi2.caiorossi1.repl.co/validador" method="post">

<div class="user-box">
<input type="text" name="c_usuario" required>
<label>Usuário</label>
</div>

<div class="user-box">
<input type="password" name="c_senha" required>
<label>Senha</label>
</div>

<button type="submit" class="btn">
Efetuar Login
</button>

</form>

<div class="footer">
Desenvolvido por <span>Vinicius Brandão</span>
</div>

</div>

</body>
</html>
```
